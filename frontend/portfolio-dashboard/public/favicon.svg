<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <title>Matrix</title>
  <!-- The Matrix mark (src/lib/logo-dots.ts: a 3 × 3 grid of dots) on the Navy & Gold tile; logo-dots.test.ts checks it. -->
  <defs>
    <linearGradient id="t" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#26407a"/><stop offset="1" stop-color="#14234a"/></linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#t)"/>
  <circle cx="20" cy="20" r="11" fill="#ffffff"/>
  <circle cx="50" cy="20" r="11" fill="#ffffff"/>
  <circle cx="80" cy="20" r="11" fill="#ffffff"/>
  <circle cx="20" cy="50" r="11" fill="#ffffff"/>
  <circle cx="50" cy="50" r="11" fill="#ffffff"/>
  <circle cx="80" cy="50" r="11" fill="#ffffff"/>
  <circle cx="20" cy="80" r="11" fill="#ffffff"/>
  <circle cx="50" cy="80" r="11" fill="#ffffff"/>
  <circle cx="80" cy="80" r="11" fill="#ffffff"/>
</svg>
