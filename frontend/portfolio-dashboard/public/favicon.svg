<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <title>Matrix</title>
  <!-- The Matrix mark (src/lib/logo-dots.ts: a 3 × 3 grid of dots) without a frame: navy on light tab bars, white on
       dark ones (the browser applies the colour scheme to SVG favicons); logo-dots.test.ts checks it. -->
  <style>
    circle { fill: #1c2f5e; }
    @media (prefers-color-scheme: dark) { circle { fill: #ffffff; } }
  </style>
  <circle cx="20" cy="20" r="11"/>
  <circle cx="50" cy="20" r="11"/>
  <circle cx="80" cy="20" r="11"/>
  <circle cx="20" cy="50" r="11"/>
  <circle cx="50" cy="50" r="11"/>
  <circle cx="80" cy="50" r="11"/>
  <circle cx="20" cy="80" r="11"/>
  <circle cx="50" cy="80" r="11"/>
  <circle cx="80" cy="80" r="11"/>
</svg>
