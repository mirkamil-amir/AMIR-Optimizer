server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Template (Dockerfile → /etc/nginx/templates): NGINX_LOCAL_RESOLVERS is the container's DNS server from
  # /etc/resolv.conf (Podman or Docker). Resolving `api` per request through a variable keeps the proxy working after
  # the API container restarts with a new address; a literal proxy_pass host is resolved once at startup (502 after).
  resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
  set $api_upstream http://api:8080;

  # Same-origin API: the browser never talks to the backend directly.
  location /api/ {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 180s;
  }
  location /health { proxy_pass $api_upstream; }
  location /swagger { proxy_pass $api_upstream; }

  location / {
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    # The bundle has no inline scripts; inline styles are needed by charts/Tailwind runtime style attributes.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    try_files $uri /index.html;
  }
}
