server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Template (Dockerfile → /etc/nginx/templates): NGINX_LOCAL_RESOLVERS is the container's DNS server from
  # /etc/resolv.conf (Podman or Docker). Resolving `api` per request through a variable keeps the proxy working after
  # the API container restarts with a new address; a literal proxy_pass host is resolved once at startup (502 after).
  resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
  set $api_upstream http://api:8080;

  # Compress the static bundle (≈ 3× smaller). API responses are not compressed (gzip_proxied stays off): they are small
  # and carry user data next to request-controlled text, the BREACH pattern (docs/performance.md › Static files).
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;

  # Same-origin API: the browser never talks to the backend directly.
  location /api/ {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 180s;
  }
  location /health { proxy_pass $api_upstream; }
  location /swagger { proxy_pass $api_upstream; }

  # Built files carry a content hash in their name: cache them for a year without revalidation. A missing file is a 404,
  # never the page (a stale tab must not receive HTML as a script).
  location /assets/ {
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location / {
    # The page and unhashed files are revalidated on every load, so a new deployment is picked up at once.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    # The bundle has no inline scripts; inline styles are needed by charts/Tailwind runtime style attributes.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    try_files $uri /index.html;
  }
}
