<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AMIR Optimizer – Allocation · Modelling · Investment · Research. Educational portfolio research; not investment advice." />
    <title>AMIR Optimizer – Allocation · Modelling · Investment · Research</title>
    <script>
      // Applies the saved theme before the first paint (no flash); lib/theme.tsx keeps it in sync afterwards.
      (function () {
        var mode = 'system', skin = 'graphite'
        try {
          var v = JSON.parse(localStorage.getItem('amir-theme') || '{}')
          if (v.mode === 'light' || v.mode === 'dark' || v.mode === 'system') mode = v.mode
          if (['graphite', 'ocean', 'forest', 'amber', 'violet'].indexOf(v.skin) >= 0) skin = v.skin
        } catch (e) { /* storage unavailable: defaults */ }
        var dark = mode === 'dark' || (mode === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
        var root = document.documentElement
        if (dark) root.classList.add('dark')
        root.dataset.skin = skin
        root.style.colorScheme = dark ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
